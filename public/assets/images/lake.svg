  <path d="M25 74 C35 72, 45 76, 55 74 C65 72, 75 76, 80 74" stroke="url(#lakeGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M32 84 C42 82, 50 86, 60 84 C70 82, 75 85, 78 84" stroke="url(#lakeGrad)" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>
  <!-- Moon reflection on water -->
