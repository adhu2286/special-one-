  <line x1="45" y1="74" x2="55" y2="74" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="48" y1="84" x2="52" y2="84" stroke="#fef08a" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
</svg>
