<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="mallGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <radialGradient id="mBackdrop" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e0b36" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="46" fill="url(#mBackdrop)" />
  <circle cx="50" cy="50" r="44" stroke="url(#mallGlow)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" fill="none" />

  <!-- Modern Geometric Mall Facade / Glass Atrium -->
  <!-- Glass Dome Skylight -->
  <path d="M 32 38 C 32 25 68 25 68 38 Z" fill="none" stroke="url(#mallGlow)" stroke-width="2" />
  <line x1="50" y1="26" x2="50" y2="38" stroke="url(#mallGlow)" stroke-width="1.5" />
  <line x1="40" y1="29" x2="44" y2="38" stroke="url(#mallGlow)" stroke-width="1.5" />
  <line x1="60" y1="29" x2="56" y2="38" stroke="url(#mallGlow)" stroke-width="1.5" />

  <!-- Main Building Structure -->
  <rect x="25" y="38" width="50" height="36" rx="2" fill="#240c3c" stroke="url(#mallGlow)" stroke-width="2" />

  <!-- Storefront Glass Panes -->
  <rect x="29" y="44" width="18" height="12" rx="1" fill="#f5d0fe" opacity="0.25" stroke="url(#mallGlow)" stroke-width="1" />
  <rect x="53" y="44" width="18" height="12" rx="1" fill="#f5d0fe" opacity="0.25" stroke="url(#mallGlow)" stroke-width="1" />

  <!-- Grand Entrance Arch & Revolving Glass Doors -->
  <path d="M 42 74 L 42 61 C 42 57 58 57 58 61 L 58 74 Z" fill="url(#mallGlow)" opacity="0.9" />
  <line x1="50" y1="60" x2="50" y2="74" stroke="#240c3c" stroke-width="1.5" />

  <!-- Boutique Bag Accent Icon -->
  <circle cx="70" cy="32" r="3" fill="#fef08a" opacity="0.9" />
</svg>
