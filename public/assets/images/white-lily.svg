<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Soft Celestial Halo Glow -->
    <filter id="lilyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambientHalo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22" result="ambientBlur" />
    </filter>

    <!-- Radial Petal Gradients -->
    <radialGradient id="haloBackdrop" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bda0ff" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#7c4dff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#120626" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Petal Gradient -->
    <linearGradient id="outerPetal" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#ede9fe" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fdfcff" />
    </linearGradient>

    <!-- Inner Petal Highlight Gradient -->
    <linearGradient id="innerPetal" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#f5f3ff" />
      <stop offset="80%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Lateral Petal Left -->
    <linearGradient id="petalLeft" x1="100%" y1="80%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#ede9fe" />
      <stop offset="85%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Lateral Petal Right -->
    <linearGradient id="petalRight" x1="0%" y1="80%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#ede9fe" />
      <stop offset="85%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Golden Stamen Gradient -->
    <linearGradient id="stamenGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d8b4e2" />
      <stop offset="60%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <radialGradient id="antherGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>

    <!-- Petal Midrib Ridge -->
    <linearGradient id="petalRidge" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ddd6fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Behind Flower -->
  <circle cx="200" cy="200" r="140" fill="url(#haloBackdrop)" filter="url(#ambientHalo)" />

  <g filter="url(#lilyGlow)" id="lilyFlower">
    <!-- Back / Outer Petals (3 points of triad) -->
    <!-- Top Outer Petal -->
    <path d="M 200 200 C 180 150 170 95 200 45 C 230 95 220 150 200 200 Z" 
          fill="url(#outerPetal)" opacity="0.95" />
    <path d="M 200 195 Q 199 120 200 50" stroke="url(#petalRidge)" stroke-width="1.5" fill="none" opacity="0.7" />

    <!-- Bottom-Left Outer Petal -->
    <path d="M 200 200 C 150 205 90 235 65 275 C 98 285 155 260 200 200 Z" 
          fill="url(#petalLeft)" opacity="0.93" />
    <path d="M 195 205 Q 130 240 70 273" stroke="url(#petalRidge)" stroke-width="1.5" fill="none" opacity="0.65" />

    <!-- Bottom-Right Outer Petal -->
    <path d="M 200 200 C 250 205 310 235 335 275 C 302 285 245 260 200 200 Z" 
          fill="url(#petalRight)" opacity="0.93" />
    <path d="M 205 205 Q 270 240 330 273" stroke="url(#petalRidge)" stroke-width="1.5" fill="none" opacity="0.65" />

    <!-- Front / Inner Petals (Overlapping for 3D depth) -->
    <!-- Upper Left Petal -->
    <path d="M 200 200 C 160 170 110 145 75 115 C 105 95 160 135 200 200 Z" 
          fill="url(#petalLeft)" opacity="0.98" />
    <path d="M 195 195 Q 140 155 80 118" stroke="url(#petalRidge)" stroke-width="1.8" fill="none" opacity="0.8" />

    <!-- Upper Right Petal -->
    <path d="M 200 200 C 240 170 290 145 325 115 C 295 95 240 135 200 200 Z" 
          fill="url(#petalRight)" opacity="0.98" />
    <path d="M 205 195 Q 260 155 320 118" stroke="url(#petalRidge)" stroke-width="1.8" fill="none" opacity="0.8" />

    <!-- Lower Center Petal (Curving downward gently) -->
    <path d="M 200 200 C 180 245 185 305 200 345 C 215 305 220 245 200 200 Z" 
          fill="url(#innerPetal)" opacity="0.99" />
    <path d="M 200 205 Q 200 275 200 340" stroke="url(#petalRidge)" stroke-width="2" fill="none" opacity="0.8" />

    <!-- Delicate Petal Texture Speckles / Papillae near base -->
    <circle cx="193" cy="180" r="1.2" fill="#7c3aed" opacity="0.5" />
    <circle cx="207" cy="182" r="1.3" fill="#7c3aed" opacity="0.5" />
    <circle cx="190" cy="195" r="1.5" fill="#8b5cf6" opacity="0.5" />
    <circle cx="210" cy="195" r="1.4" fill="#8b5cf6" opacity="0.5" />
    <circle cx="195" cy="212" r="1.2" fill="#7c3aed" opacity="0.5" />
    <circle cx="205" cy="214" r="1.3" fill="#7c3aed" opacity="0.5" />

    <!-- Central Pistil & Stamens with Golden Anthers -->
    <!-- Stamen 1: Top Left -->
    <path d="M 200 200 Q 185 160 165 145" stroke="url(#stamenGlow)" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <ellipse cx="163" cy="143" rx="5.5" ry="3" transform="rotate(-30 163 143)" fill="url(#antherGold)" />

    <!-- Stamen 2: Top Right -->
    <path d="M 200 200 Q 215 160 235 145" stroke="url(#stamenGlow)" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <ellipse cx="237" cy="143" rx="5.5" ry="3" transform="rotate(30 237 143)" fill="url(#antherGold)" />

    <!-- Stamen 3: Mid Left -->
    <path d="M 200 200 Q 170 195 145 202" stroke="url(#stamenGlow)" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <ellipse cx="143" cy="203" rx="5.5" ry="3" transform="rotate(-15 143 203)" fill="url(#antherGold)" />

    <!-- Stamen 4: Mid Right -->
    <path d="M 200 200 Q 230 195 255 202" stroke="url(#stamenGlow)" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <ellipse cx="257" cy="203" rx="5.5" ry="3" transform="rotate(15 257 203)" fill="url(#antherGold)" />

    <!-- Stamen 5: Lower Left -->
    <path d="M 200 200 Q 185 230 172 250" stroke="url(#stamenGlow)" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <ellipse cx="170" cy="252" rx="5.5" ry="3" transform="rotate(-45 170 252)" fill="url(#antherGold)" />

    <!-- Stamen 6: Lower Right -->
    <path d="M 200 200 Q 215 230 228 250" stroke="url(#stamenGlow)" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <ellipse cx="230" cy="252" rx="5.5" ry="3" transform="rotate(45 230 252)" fill="url(#antherGold)" />

    <!-- Central Pistil Style & Stigma (Soft Greenish-Lavender Luminescence) -->
    <path d="M 200 200 Q 200 170 200 135" stroke="#ecfdf5" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="200" cy="133" r="4.5" fill="#a7f3d0" />
    <circle cx="200" cy="133" r="2.2" fill="#ffffff" />

    <!-- Luminous Core Sparkle -->
    <circle cx="200" cy="200" r="7" fill="#ffffff" opacity="0.9" />
    <circle cx="200" cy="200" r="14" fill="#ddd6fe" opacity="0.4" />
  </g>
</svg>
