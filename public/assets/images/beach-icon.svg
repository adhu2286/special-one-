<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="beachGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="bBackdrop" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e0b36" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="waveFoam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="46" fill="url(#bBackdrop)" />
  <circle cx="50" cy="50" r="44" stroke="url(#beachGlow)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" fill="none" />

  <!-- Dusk Sunset / Starlit Horizon Glow -->
  <circle cx="50" cy="40" r="12" fill="#fed7aa" opacity="0.45" />

  <!-- Shoreline Palm Tree -->
  <path d="M 28 68 Q 29 45 35 34" stroke="#e9d5ff" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <!-- Palm Fronds -->
  <path d="M 35 34 Q 25 32 20 38" stroke="#e9d5ff" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <path d="M 35 34 Q 28 26 23 27" stroke="#e9d5ff" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <path d="M 35 34 Q 40 24 46 27" stroke="#e9d5ff" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <path d="M 35 34 Q 45 33 48 40" stroke="#e9d5ff" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- Ocean Waves Rolling onto Sand -->
  <!-- Horizon line -->
  <line x1="22" y1="52" x2="78" y2="52" stroke="#c084fc" stroke-width="1.5" opacity="0.6" />
  <!-- Wave 1 -->
  <path d="M 24 60 C 35 56 45 64 58 60 C 68 56 74 61 78 60" stroke="url(#waveFoam)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <!-- Wave 2 (Breaking Surf) -->
  <path d="M 22 68 C 34 64 48 72 62 67 C 70 64 74 69 78 68" stroke="url(#waveFoam)" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <!-- Shoreline Beach Contour -->
  <path d="M 20 76 Q 50 72 80 76" stroke="#fed7aa" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Little Evening Stars -->
  <circle cx="68" cy="26" r="1.5" fill="#fef08a" opacity="0.9" />
  <circle cx="76" cy="36" r="1.2" fill="#ffffff" opacity="0.7" />
</svg>
